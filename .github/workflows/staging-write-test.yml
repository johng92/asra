name: Staging Write Test

on:
  push:
    branches:
      - develop

jobs:
  write-test:
    runs-on: ubuntu-latest

    environment: staging

    steps:
      - name: Write test file to staging
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ vars.STAGING_HOST }}
          SSH_PORT: ${{ vars.STAGING_PORT }}
          SSH_USER: ${{ vars.STAGING_USER }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}

        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/asra_staging_deploy
          chmod 600 ~/.ssh/asra_staging_deploy

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/asra_staging_deploy \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "printf '%s\n' 'ASRA staging deployment test successful.' > '$STAGING_PATH/deployment-test.txt' && echo 'Test file created:' && cat '$STAGING_PATH/deployment-test.txt' && echo 'File details:' && ls -l '$STAGING_PATH/deployment-test.txt'"